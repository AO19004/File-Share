name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter version (leave empty = latest stable, e.g. 3.24.5)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ github.event.inputs.flutter_version }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android project files (only if missing)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.fileshare.app --project-name fileshare /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      - name: Patch AndroidManifest (permissions + app name)
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
          """
          if "MANAGE_EXTERNAL_STORAGE" not in s:
              s = re.sub(r"(<manifest[^>]*>)", lambda m: m.group(1) + perms, s, count=1)
          if "requestLegacyExternalStorage" not in s:
              s = s.replace("<application", '<application\n        android:requestLegacyExternalStorage="true"', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="FileShare"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          print(s)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Analyze (shows Dart errors early; does not stop the build)
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: FileShare-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Publish to Releases (only when you push a tag like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
