name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter version (leave empty = 3.27.4)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (pinned, consistent with the plugin versions)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ github.event.inputs.flutter_version || '3.27.4' }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android project files (only if missing)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.fileshare.app --project-name fileshare /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      - name: Patch AndroidManifest (permissions + app name)
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
          """
          if "MANAGE_EXTERNAL_STORAGE" not in s:
              s = re.sub(r"(<manifest[^>]*>)", lambda m: m.group(1) + perms, s, count=1)
          if "requestLegacyExternalStorage" not in s:
              s = s.replace("<application", '<application\n        android:requestLegacyExternalStorage="true"', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="FileShare"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          print(s)
          PY

      - name: Add native bridge (permissions, open file) - no plugins needed
        run: |
          python3 - <<'PY'
          import glob, os, re
          base = "android/app/src/main"

          KOTLIN = """package __PKG__

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.Settings
          import android.webkit.MimeTypeMap
          import androidx.core.content.FileProvider
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "fileshare/native")
                      .setMethodCallHandler { call, result ->
                          try {
                              when (call.method) {
                                  "appDir" -> result.success(filesDir.absolutePath)
                                  "extFilesDir" -> result.success((getExternalFilesDir(null) ?: filesDir).absolutePath)
                                  "hasAllFiles" -> result.success(hasAllFiles())
                                  "requestAllFiles" -> {
                                      requestAllFiles()
                                      result.success(true)
                                  }
                                  "openFile" -> result.success(openFile(call.argument<String>("path") ?: ""))
                                  else -> result.notImplemented()
                              }
                          } catch (e: Exception) {
                              result.error("ERR", e.message, null)
                          }
                      }
              }

              private fun hasAllFiles(): Boolean {
                  if (Build.VERSION.SDK_INT >= 30) return Environment.isExternalStorageManager()
                  if (Build.VERSION.SDK_INT >= 23) {
                      return checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED
                  }
                  return true
              }

              private fun requestAllFiles() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      try {
                          val i = Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:" + packageName))
                          startActivity(i)
                      } catch (e: Exception) {
                          startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION))
                      }
                  } else if (Build.VERSION.SDK_INT >= 23) {
                      requestPermissions(arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE, Manifest.permission.WRITE_EXTERNAL_STORAGE), 1001)
                  }
              }

              private fun openFile(path: String): Boolean {
                  val f = File(path)
                  if (!f.exists()) return false
                  val uri = FileProvider.getUriForFile(this, packageName + ".fileprovider", f)
                  val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(f.extension.lowercase()) ?: "*/*"
                  val i = Intent(Intent.ACTION_VIEW)
                  i.setDataAndType(uri, mime)
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  startActivity(i)
                  return true
              }
          }
          """

          # 1) MainActivity.kt (keep the package the template generated)
          cands = glob.glob(base + "/**/MainActivity.*", recursive=True)
          pkg = None
          for c in cands:
              m = re.search(r"^package\s+([\w.]+)", open(c, encoding="utf-8").read(), re.M)
              if m:
                  pkg = m.group(1)
                  break
          pkg = pkg or "com.fileshare.app.fileshare"
          for c in cands:
              os.remove(c)
          kdir = os.path.join(base, "kotlin", *pkg.split("."))
          os.makedirs(kdir, exist_ok=True)
          open(os.path.join(kdir, "MainActivity.kt"), "w", encoding="utf-8").write(KOTLIN.replace("__PKG__", pkg))

          # 2) FileProvider paths
          xd = os.path.join(base, "res", "xml")
          os.makedirs(xd, exist_ok=True)
          open(os.path.join(xd, "file_paths.xml"), "w", encoding="utf-8").write(
              '<?xml version="1.0" encoding="utf-8"?>\n<paths>\n    <root-path name="root" path="." />\n</paths>\n')

          # 3) FileProvider in the manifest
          mp = base + "/AndroidManifest.xml"
          s = open(mp, encoding="utf-8").read()
          if "FileProvider" not in s:
              prov = """<provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              """
              s = s.replace("</application>", prov + "</application>", 1)
              open(mp, "w", encoding="utf-8").write(s)

          # 4) androidx.core dependency (for FileProvider)
          gk, gg = "android/app/build.gradle.kts", "android/app/build.gradle"
          if os.path.exists(gk):
              t = open(gk, encoding="utf-8").read()
              if "androidx.core:core" not in t:
                  open(gk, "a", encoding="utf-8").write('\ndependencies {\n    implementation("androidx.core:core:1.12.0")\n}\n')
          elif os.path.exists(gg):
              t = open(gg, encoding="utf-8").read()
              if "androidx.core:core" not in t:
                  open(gg, "a", encoding="utf-8").write('\ndependencies {\n    implementation "androidx.core:core:1.12.0"\n}\n')

          print("package:", pkg)
          print(open(mp, encoding="utf-8").read())
          PY

      - name: Get packages
        run: flutter pub get

      - name: Show resolved plugin versions (for debugging)
        run: flutter pub deps --style=compact | head -60
        continue-on-error: true

      - name: Analyze (shows Dart errors early; does not stop the build)
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: FileShare-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Publish to Releases (only when you push a tag like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
