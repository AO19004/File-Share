name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter version (leave empty = latest stable, e.g. 3.24.5)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ github.event.inputs.flutter_version }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android project files (only if missing)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.fileshare.app --project-name fileshare /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      - name: Patch AndroidManifest (permissions + app name)
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
          """
          if "MANAGE_EXTERNAL_STORAGE" not in s:
              s = re.sub(r"(<manifest[^>]*>)", lambda m: m.group(1) + perms, s, count=1)
          if "requestLegacyExternalStorage" not in s:
              s = s.replace("<application", '<application\n        android:requestLegacyExternalStorage="true"', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="FileShare"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          print(s)
          PY

      - name: Fix plugin compileSdk + skip AAR metadata check
        run: |
          python3 - <<'PY'
          import os
          kts = "android/build.gradle.kts"
          groovy = "android/build.gradle"
          kts_snip = """subprojects {
              // raise compileSdk of every module (app + plugins) so newer plugins pass the check
              afterEvaluate {
                  extensions.findByName("android")?.withGroovyBuilder {
                      "compileSdkVersion"(37)
                  }
              }
              // safety net: skip the AAR metadata check (works regardless of ordering)
              tasks.configureEach {
                  if (name.startsWith("check") && name.endsWith("AarMetadata")) {
                      enabled = false
                  }
              }
          }

          """
          groovy_snip = """subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 37
                      }
                  }
              }
              tasks.configureEach { t ->
                  if (t.name.startsWith("check") && t.name.endsWith("AarMetadata")) {
                      t.enabled = false
                  }
              }
          }

          """
          if os.path.exists(kts):
              path, snip = kts, kts_snip
          elif os.path.exists(groovy):
              path, snip = groovy, groovy_snip
          else:
              path, snip = kts, kts_snip      # no root script in this template: create one
              open(path, "w", encoding="utf-8").write("")
          lines = open(path, encoding="utf-8").read().split("\n")
          i = 0
          while i < len(lines) and (lines[i].startswith("import ") or lines[i].strip() == ""):
              i += 1
          if "AarMetadata" not in "\n".join(lines):
              lines[i:i] = snip.split("\n")
          open(path, "w", encoding="utf-8").write("\n".join(lines))

          # AGP only recommends up to a certain compileSdk; this just silences that warning
          gp = "android/gradle.properties"
          txt = open(gp, encoding="utf-8").read() if os.path.exists(gp) else ""
          if "suppressUnsupportedCompileSdk" not in txt:
              open(gp, "a", encoding="utf-8").write("\nandroid.suppressUnsupportedCompileSdk=37\n")

          print("==== PATCH APPLIED TO:", path, "====")
          print("\n".join(lines))
          print("==== android/gradle.properties ====")
          print(open(gp, encoding="utf-8").read())
          PY

      - name: Get packages
        run: flutter pub get

      - name: Analyze (shows Dart errors early; does not stop the build)
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: FileShare-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Publish to Releases (only when you push a tag like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
