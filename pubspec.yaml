name: fileshare
description: FileShare - LAN file transfer (compatible with the desktop app).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  permission_handler: ^11.0.0
  open_filex: ^4.3.0
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  wakelock_plus: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
