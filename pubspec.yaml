name: fileshare
description: FileShare - LAN file transfer (compatible with the desktop app).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

# Only 3 plugins, versions from the same era as Flutter 3.27 (consistent toolchain)
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ">=2.3.0 <2.4.0"
  permission_handler: 11.3.1
  open_filex: ">=4.3.4 <4.7.0"

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
